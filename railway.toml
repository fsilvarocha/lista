[build]
builder = "nixpacks"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# Volume (disco persistente para o SQLite):
# Crie no painel Railway → Service → Volumes → Add Volume
# Mount Path: /app/data
